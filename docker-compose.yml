services:
  mysql:
    image: mysql:8
    container_name: hub-event-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hub_event}
      MYSQL_USER: ${MYSQL_USER:-hub_event}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hub_event}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docs/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: hub-event-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-hub_event}
      DB_USER: ${MYSQL_USER:-hub_event}
      DB_PASSWORD: ${MYSQL_PASSWORD:-hub_event}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      APP_FRONTEND_URL: http://localhost:4200
      IMGBB_API_KEY: ""
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: hub-event-frontend
    environment:
      NGINX_ENVSUBST_FILTER: BACKEND_
      BACKEND_SCHEME: http
      BACKEND_HOST: backend:8080
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql-data:
