@if (images().length > 0) {
  <section class="gallery" aria-label="Photos de l'événement">
    <ul class="gallery__list">
      @for (image of images(); track image.id) {
        <li class="gallery__item" [class.gallery__item--preview]="image.isPreview">
          <img [src]="image.url" [alt]="'Photo ' + ($index + 1) + ' – ' + eventTitle()" />
        </li>
      }
    </ul>
  </section>
}
