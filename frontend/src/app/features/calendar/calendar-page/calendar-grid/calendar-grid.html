<div class="grid" role="grid">
  <div class="weekday" role="row">
    @for (label of weekdayLabels; track label) {
      <span class="weekday-cell" role="columnheader">{{ label }}</span>
    }
  </div>

  @for (week of weeks(); track week[0].date) {
    <div class="week" role="row">
      @for (day of week; track day.date) {
        <span
          class="day"
          role="gridcell"
          [class.day--padding]="!day.inRange"
          [class.day--highlighted]="highlightedDates().has(day.date)"
          [class.day--first]="day.dayOfMonth === 1"
        >
          @if (day.dayOfMonth === 1) {
            <span class="month-name">{{ day.date | date: 'MMM' }}</span>
          }
          {{ day.dayOfMonth }}
        </span>
      }
    </div>
  }
</div>
