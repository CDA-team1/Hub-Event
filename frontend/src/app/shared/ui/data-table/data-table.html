<table>
  <thead>
    <tr>
      @for (column of columns(); track column.key) {
        @if (column.sortable) {
          <th [attr.aria-sort]="ariaSort(column)">
            <button type="button" (click)="onHeaderClick(column)">
              {{ column.header }}
              @switch (sortDirection(column)) {
                @case ('asc') {
                  <span class="sort-indicator">▲</span>
                }
                @case ('desc') {
                  <span class="sort-indicator">▼</span>
                }
              }
            </button>
          </th>
        } @else {
          <th>{{ column.header }}</th>
        }
      }
    </tr>
  </thead>
  <tbody>
    @for (row of rows(); track trackBy()(row, $index)) {
      <tr>
        @for (column of columns(); track column.key) {
          <td>
            <ng-container *ngTemplateOutlet="templateFor(column.key); context: { $implicit: row }" />
          </td>
        }
      </tr>
    }
  </tbody>
</table>
