<article class="account-card">
  <div class="account-card__field account-card__last-name">
    <span class="account-card__label">Nom</span>
    <span>{{ user().lastName }}</span>
  </div>

  <div class="account-card__field account-card__first-name">
    <span class="account-card__label">Prénom</span>
    <span>{{ user().firstName }}</span>
  </div>

  <div class="account-card__field account-card__email">
    <span class="account-card__label">Email</span>
    <span>{{ user().email }}</span>
  </div>

  <div class="account-card__field account-card__role">
    <span class="account-card__label">Rôle</span>
    <app-role-badge [role]="user().role" />
  </div>

  <div class="account-card__field account-card__status">
    <span class="account-card__label">Statut</span>

    @switch (user().status) {
      @case ('ACTIVE') {
        <span>Actif</span>
      }
      @case ('INACTIVE') {
        <span>Inactif</span>
      }
      @case ('ANONYMIZED') {
        <span>Anonymisé</span>
      }
    }
  </div>

  <div class="account-card__actions">
    <a [routerLink]="['/admin/comptes', user().id]">Modifier</a>

    <button type="button" (click)="suspend()">Suspendre</button>
  </div>
</article>
