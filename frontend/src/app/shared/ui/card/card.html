<article class="card" [class.card--clickable]="data().link" [routerLink]="data().link">
  @if (data().imageUrl) {
    <img class="card__image" [src]="data().imageUrl" [alt]="data().title" />
  } @else {
    <div class="card__image-placeholder" aria-hidden="true"></div>
  }

  <div class="card__content">
    <h2 class="card__title">
      {{ data().title }}
    </h2>

    @for (info of data().information; track $index) {
      <p class="card__info">
        {{ info }}
      </p>
    }

    <div class="card__footer">
      @if (data().category; as category) {
        <app-category-badge [category]="category" />
      }

      @if (data().actionLabel) {
        <button class="card__action" type="button" (click)="triggerAction($event)">
          {{ data().actionLabel }}
        </button>
      }
    </div>
  </div>
</article>
