# Appliqué à TOUS les tests, quel que soit le profil (les tests @WebMvcTest n'activent pas "test").
# Sans cela, les nombreux appels de /auth/login ou /comments faits par les tests d'une même classe
# partageraient le quota par adresse IP (127.0.0.1) et recevraient des 429.
# Les tests du limiteur le réactivent avec @TestPropertySource.
app.rate-limit.enabled=false
