spring.application.name=GHE

# Toutes les routes de l'API sont exposées sous /api (SOCLE-02) : le proxy de développement
# Angular (proxy.conf.json) redirige tout /api/* vers ce serveur, sans ambiguïté possible
# avec les routes propres au front (ex. /events côté Angular vs /api/events côté back).
server.servlet.context-path=/api

# Profil utilisé par défaut lors d'un lancement local depuis l'IDE
spring.profiles.default=dev

# Import d'un fichier de secrets local (non versionné)
spring.config.import=optional:file:./.env.properties

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# --- Email (SMTP) ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sans délai, un serveur SMTP injoignable bloquerait indéfiniment l'envoi (JavaMail n'en impose aucun).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL de base utilisée pour construire le lien d'activation envoyé par email
app.base-url=${APP_BASE_URL}
app.frontend-url=${APP_FRONTEND_URL}

# --- Hébergement des images ---
app.imgbb.api-key=${IMGBB_API_KEY}

# Taille maximale des images de la galerie (EVT-09). Spring refuse par défaut les fichiers de plus
# de 1 Mo, ce qui exclut la plupart des photos. À garder en phase avec MAX_IMAGE_SIZE_MB du front.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# Nombre maximal d'images dans un même envoi (SEC-08). Ne limite pas le total d'images d'un événement :
# on peut en ajouter d'autres au fil des envois. Doit rester sous server.tomcat.max-part-count (50).
app.images.max-files-per-request=20