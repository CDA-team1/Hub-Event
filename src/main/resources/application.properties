spring.application.name=GHE

# Import d'un fichier de secrets local (non versionné)
spring.config.import=optional:file:./.env.properties

# --- Datasource MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/ghe_db_dev
spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Initialisation des données ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- JWT ---
# Clé secrète utilisée pour signer et vérifier les tokens JWT
jwt.secret=${JWT_SECRET}
# Durée de validité d'un token, en millisecondes (1h)
jwt.expiration-ms=3600000