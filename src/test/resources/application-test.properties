spring.datasource.url=jdbc:h2:mem:ghe_test;MODE=MySQL;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop

# Pas d'amorçage de comptes de démo pendant les tests (données isolées par test)
application.init=false
# data.sql (CPT-07) est un jeu de données de dev, pas exécuté pendant les tests
spring.sql.init.mode=never

# --- JWT ---
# Clé Base64 factice utilisée uniquement pour les tests
jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# --- Email (SMTP) : valeurs factices, aucun email n'est réellement envoyé en test ---
app.base-url=http://localhost:8080
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

# --- Stockage des fichiers : répertoire isolé sous target/, nettoyé par mvn clean ---
app.upload-dir=target/test-uploads